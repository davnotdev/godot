[package]
name = "naga-wrapper"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
# We need spv-out purely to enable pipeline override functionality
naga = { git = "https://github.com/davnotdev/wgpu", branch = "trunk-naga-patches", features = ["spv-in", "spv-out", "wgsl-out"] }
